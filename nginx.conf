server {
    listen 80;
    server_name localhost;

    # Compresión gzip para alta velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el motor fiscal Emitta Cloud Staging
    location /api/ {
        proxy_pass https://api-emitta.nexorf.dev/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api-emitta.nexorf.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    location /actuator/ {
        proxy_pass https://api-emitta.nexorf.dev/actuator/;
        proxy_ssl_server_name on;
        proxy_set_header Host api-emitta.nexorf.dev;
    }
}
